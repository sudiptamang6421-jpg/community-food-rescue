<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up - Community Food Rescue</title>
  
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Fullscreen Video Background Container */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background Video Styling */
    #bgVideo {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    /* Dark Overlay for Contrast */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 2;
    }

    /* Frosted Glass Auth Card */
    .auth-card {
      position: relative;
      z-index: 3;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 40px 35px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .auth-card h2 {
      color: #1b5e20;
      font-size: 1.8rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-card p {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 25px;
      text-align: center;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
    }

    .error-message {
      color: #d32f2f;
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      background-color: #2e7d32;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #1b5e20;
    }

    /* Mode Switch Toggle */
    .auth-toggle {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #444;
    }

    .auth-toggle button {
      background: none;
      border: none;
      color: #2e7d32;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Background Food Video -->
    <video autoplay muted loop playsinline id="bgVideo">
      <source src="images/bg-video.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Dark Overlay Filter -->
    <div class="video-overlay"></div>

    <!-- Login / Sign Up Card -->
    <div class="auth-card">
      <h2 id="modalTitle">Food Rescue</h2>
      <p id="modalSubtitle">Log in to manage community food donations</p>

      <form id="authForm" novalidate>
        <div class="form-group">
          <label for="authEmail">Email Address</label>
          <input type="email" id="authEmail" placeholder="e.g. user@foodrescue.org" required>
          <span class="error-message" id="authEmailError">Please enter a valid email address.</span>
        </div>

        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="At least 6 characters" required>
          <span class="error-message" id="authPasswordError">Password must be at least 6 characters long.</span>
        </div>

        <button type="submit" id="authSubmitBtn" class="btn">Log In</button>
      </form>

      <div class="auth-toggle">
        <span id="toggleText">Don't have an account?</span>
        <button type="button" id="toggleAuthBtn">Sign Up</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const authForm = document.getElementById('authForm');
      const modalTitle = document.getElementById('modalTitle');
      const modalSubtitle = document.getElementById('modalSubtitle');
      const authSubmitBtn = document.getElementById('authSubmitBtn');
      const toggleAuthBtn = document.getElementById('toggleAuthBtn');
      const toggleText = document.getElementById('toggleText');

      let isSignUpMode = false; // Starts in Login mode

      // Switch between Log In and Sign Up modes
      toggleAuthBtn.addEventListener('click', () => {
        isSignUpMode = !isSignUpMode;

        // Hide error messages when toggling mode
        document.getElementById('authEmailError').style.display = 'none';
        document.getElementById('authPasswordError').style.display = 'none';

        if (isSignUpMode) {
          modalTitle.textContent = "Create Account";
          modalSubtitle.textContent = "Join our food bank rescue network";
          authSubmitBtn.textContent = "Sign Up";
          toggleText.textContent = "Already have an account?";
          toggleAuthBtn.textContent = "Log In";
        } else {
          modalTitle.textContent = "Food Rescue";
          modalSubtitle.textContent = "Log in to manage community food donations";
          authSubmitBtn.textContent = "Log In";
          toggleText.textContent = "Don't have an account?";
          toggleAuthBtn.textContent = "Sign Up";
        }
      });

      // Handle Form Submit
      authForm.addEventListener('submit', (e) => {
        e.preventDefault(); // Prevents page reload

        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        const emailError = document.getElementById('authEmailError');
        const passwordError = document.getElementById('authPasswordError');

        let isValid = true;

        // Email validation
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailError.style.display = 'block';
          isValid = false;
        } else {
          emailError.style.display = 'none';
        }

        // Password validation
        if (password.length < 6) {
          passwordError.style.display = 'block';
          isValid = false;
        } else {
          passwordError.style.display = 'none';
        }

        if (!isValid) return;

        // Retrieve registered users from LocalStorage
        const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');

        if (isSignUpMode) {
          // --- SIGN UP LOGIC ---
          const existingUser = users.find(u => u.email.toLowerCase() === email.toLowerCase());

          if (existingUser) {
            alert('An account with this email already exists. Please log in.');
            return;
          }

          users.push({ email, password });
          localStorage.setItem('registeredUsers', JSON.stringify(users));
          localStorage.setItem('currentUser', email);

          alert('Account created successfully! Welcome to Food Rescue.');
          window.location.href = 'index.html'; // Redirect to home page

        } else {
          // --- LOG IN LOGIC ---
          const userMatch = users.find(
            u => u.email.toLowerCase() === email.toLowerCase() && u.password === password
          );

          if (userMatch) {
            localStorage.setItem('currentUser', email);
            alert('Logged in successfully!');
            window.location.href = 'index.html'; // Redirect to home page
          } else {
            alert('Incorrect email or password. Please try again or click "Sign Up" first.');
          }
        }
      });
    });
  </script>
</body>
</html>
